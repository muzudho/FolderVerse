<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>No.39 むずでょ監修プロポーション試作３枚</title><style>body{background:#172438;color:#edf2ff;font:16px system-ui;max-width:1300px;margin:24px auto;padding:0 16px}a{color:#a5d8ff}select,input,button{font:inherit}nav{position:sticky;top:0;background:#172438ee;padding:12px;z-index:2}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}figure{margin:0}img{width:100%;display:block}figcaption{padding:10px}.stage{position:relative;aspect-ratio:4/3;background:#24354e}.stage img{position:absolute;width:100%;height:100%;object-fit:contain}.stage img+img{opacity:.5}section{margin:32px 0}p{line-height:1.7}@media(max-width:800px){.pair{grid-template-columns:1fr}}</style><h1>No.39：むずでょ監修プロポーション試作</h1><p><a href="proportion-v017-comparison.html">No.39：最新v017プロポーションで試作した３枚を比較</a></p><p><a href="../character-01/matched-no39-scenes/index.html">No.1とNo.39：同構図３枚の重ね合わせ・基準点比較</a></p><p>既存の構図を引き継いだ３枚。頭・胴・手・脚の比率は承認済みの共通設定を参照。画像生成による試作で、構図や衣装にも細かな差があります。元画像を保存し、ゲーム用画像への取り込み前に比較するページです。</p><nav><a href="#p1">読書</a> ／ <a href="#p2">犬の玩具</a> ／ <a href="#p3">雪の中で腰掛ける</a> ／ <a href="#overlay">重ね合わせ</a></nav><main id="gallery"></main><section id="overlay"><h2>重ね合わせ</h2><select id="scene"><option value="0">１：読書</option><option value="1">２：犬の玩具</option><option value="2">３：腰掛ける</option></select><p><input id="alpha" type="range" min="0" max="100" value="50"> <output id="value">50%</output> <button data-a="0">旧版のみ</button> <button data-a="50">50％</button> <button data-a="100">新版のみ</button></p><div class="stage"><img id="old"><img id="new"></div></section><script>const items=[{n:1,v:'007',title:'図書館で読書'},{n:2,v:'006',title:'犬の玩具を抱く'},{n:3,v:'006',title:'雪の中で腰掛ける'}];const file=(x,old)=>`character-39-${x.n}-v${old?'005':x.v}-generated.png`;document.getElementById('gallery').innerHTML=items.map(x=>`<section id="p${x.n}"><h2>${x.n}：${x.title}</h2><div class="pair"><figure><a href="${file(x,true)}"><img loading="lazy" src="${file(x,true)}" alt="旧版"></a><figcaption>旧版 v005</figcaption></figure><figure><a href="${file(x,false)}"><img loading="lazy" src="${file(x,false)}" alt="新版"></a><figcaption>共通プロポーション試作 v${x.v} ／ <a href="character-39-${x.n}-v${x.v}-prompt.txt">生成指示</a></figcaption></figure></div></section>`).join('');const $=id=>document.getElementById(id);function update(){const x=items[+$('scene').value];$('old').src=file(x,true);$('new').src=file(x,false);$('new').style.opacity=$('alpha').value/100;$('value').textContent=$('alpha').value+'%';}for(const id of ['scene','alpha'])$(id).addEventListener('input',update);document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{$('alpha').value=b.dataset.a;update()});update();</script></html>
