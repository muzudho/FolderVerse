<!doctype html><html lang="ja"><meta charset="utf-8"><title>No.40 共通画風更新 制作中</title><style>body{background:#172438;color:#eef;font:17px/1.7 system-ui;max-width:1050px;margin:30px auto}a{color:#9df}button,input,select{font:inherit}.stage{position:relative;aspect-ratio:4/3;width:100%;background:#25374d}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}#after{opacity:.5}.tiles{display:flex;gap:20px}</style><h1>No.40 共通画風更新 制作中</h1><p>通常１・２の候補画像。ゲームへの適用はまだです。旧ゲーム画像を保存済み。残りの通常４枚・新聞８枚を次回以降に制作します。</p><select id="scene"><option value="1">通常１</option><option value="2">通常２</option></select><button data-a="0">旧版</button><button data-a="50">50％</button><button data-a="100">新版</button><input id="alpha" type="range" min="0" max="100" value="50"><div class="stage"><img id="before"><img id="after"></div><div class="tiles"><article><h2>通常1</h2><img src="character-40-normal-1.png" width="256" height="192"><p><a href="character-40-normal-1-generated.png">原画</a> / <a href="character-40-normal-1-prompt.txt">生成指示</a></p></article><article><h2>通常2</h2><img src="character-40-normal-2.png" width="256" height="192"><p><a href="character-40-normal-2-generated.png">原画</a> / <a href="character-40-normal-2-prompt.txt">生成指示</a></p></article></div><p><a href="production.md">制作記録</a> / <a href="generation-progress.json">進捗とハッシュ</a></p><script>const $=x=>document.getElementById(x);function update(){const n=$('scene').value;$('before').src='backup/v3-standardized/tiles/character-40-'+n+'.png';$('after').src='character-40-normal-'+n+'-generated.png';$('after').style.opacity=$('alpha').value/100;}document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{$('alpha').value=b.dataset.a;update()});$('scene').onchange=update;$('alpha').oninput=update;update();</script></html>
