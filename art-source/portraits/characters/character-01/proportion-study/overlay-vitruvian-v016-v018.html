<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>王女 v016・v018 比較</title><style>body{background:#172438;color:#edf3ff;font:16px system-ui;max-width:1100px;margin:24px auto;padding:0 16px}a{color:#a9d9ff}button,input{font:inherit}.stage{position:relative;aspect-ratio:1}.stage img{position:absolute;width:100%;height:100%;object-fit:contain}.stage img+img{opacity:.5}p{line-height:1.7}</style><h1>王女：膝頭を半個分上げる下半身の試作</h1><p>v016 → v018。膝頭を約半個分上へ移し、下半身の大腿部とすねをつなぎ直す指示で生成。上半身・股・くるぶし・足先・円は維持を指定。生成による局所的なずれも含みます。最新承認基準は引き続きv016です。</p><p><button data-a="0">v016 のみ</button> <button data-a="50">50％</button> <button data-a="100">v018 のみ</button> <input id="alpha" type="range" min="0" max="100" value="50"><output id="value">50%</output></p><div class="stage"><img src="character-01-vitruvian-v016.png" alt="v016"><img id="new" src="character-01-vitruvian-v018.png" alt="v018"></div><p><a href="character-01-vitruvian-v018.png">v018 原画像</a> ／ <a href="character-01-vitruvian-v018-prompt.txt">内蔵画像生成への指示</a></p><script>const a=document.getElementById('alpha');function update(){document.getElementById('new').style.opacity=a.value/100;document.getElementById('value').textContent=a.value+'%'}a.oninput=update;document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{a.value=b.dataset.a;update()});</script></html>
