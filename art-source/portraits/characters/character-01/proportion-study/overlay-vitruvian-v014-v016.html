<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>王女 v014・v016 比較</title><style>body{background:#172438;color:#edf3ff;font:16px system-ui;max-width:1100px;margin:24px auto;padding:0 16px}a{color:#a9d9ff}button,input{font:inherit}.stage{position:relative;aspect-ratio:1}.stage img{position:absolute;width:100%;height:100%;object-fit:contain}.stage img+img{opacity:.5}p{line-height:1.7}</style><h1>王女：足1.2倍・足首と脚の開きを調整</h1><p>v014 → v016。足首から先と靴を約1.2倍、足首を手首に釣り合う太さに。くるぶしを既存の円周に近づけるため脚の開きも調整。生成による近似で、円との厳密な幾何学的一致にはずれがあります。</p><p><button data-a="0">v014 のみ</button> <button data-a="50">50％</button> <button data-a="100">v016 のみ</button> <input id="alpha" type="range" min="0" max="100" value="50"><output id="value">50%</output></p><div class="stage"><img src="character-01-vitruvian-v014.png" alt="v014"><img id="new" src="character-01-vitruvian-v016.png" alt="v016"></div><p><a href="character-01-vitruvian-v016.png">v016 原画像</a> ／ <a href="character-01-vitruvian-v016-prompt.txt">内蔵画像生成への指示</a></p><script>const a=document.getElementById('alpha');function update(){document.getElementById('new').style.opacity=a.value/100;document.getElementById('value').textContent=a.value+'%'}a.oninput=update;document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{a.value=b.dataset.a;update()});</script></html>
